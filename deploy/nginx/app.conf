# Nginx INTERNO da stack — só HTTP, numa porta local (127.0.0.1:APP_PORT).
# Unifica front + API + fotos num único upstream. O TLS/domínio fica no reverse
# proxy que já existe no seu servidor (ver deploy/README.md).
server {
    listen 80;
    server_name _;

    # Uploads de foto de encomenda
    client_max_body_size 20m;

    # API NestJS (mantém o prefixo /api)
    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 60s;
    }

    # Fotos servidas pelo MinIO (bucket público). /fotos/<bucket>/<arquivo>
    location /fotos/ {
        proxy_pass http://minio:9000/;
        proxy_set_header Host $host;
        proxy_hide_header x-amz-request-id;
        proxy_hide_header x-amz-id-2;
    }

    # ---- Painel (SPA Vite) -------------------------------------------------
    # A BARRA FINAL do proxy_pass é a decisão central deste arquivo: com
    # `http://web:80/` o nginx REMOVE o /app antes de repassar, então o
    # container `web` recebe /encomendas e o web/nginx.conf continua valendo sem
    # uma linha alterada. Sem a barra, ele receberia /app/encomendas e seria
    # preciso mexer no root/try_files de lá — mais peças, mesmo resultado.
    location /app/ {
        proxy_pass http://web:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Atalhos: as URLs que as pessoas digitam, compartilham e imprimem.
    location = /app   { return 301 /app/; }
    location = /login { return 301 /app/login; }

    # QR de autocadastro já impresso e colado no elevador. Os novos QRs já
    # nascem com /app/ (ver QrAutocadastroDialog), mas papel não se atualiza:
    # sem este redirect, todo QR gerado antes da landing levaria o morador ao
    # site de marketing.
    location /cadastro/ { return 301 /app$request_uri; }

    # ---- Landing page ------------------------------------------------------
    # Next.js rodando `next start` (build standalone) na porta 3000 — não é
    # nginx com pasta estática como o painel. As páginas são pré-renderizadas
    # no build; o processo Node existe para servir `/llms.txt`, `/sitemap.xml`
    # e o que vier de rota dinâmica. Ver landing/CLAUDE.md.
    #
    # SEM barra final aqui, ao contrário do /app/: o caminho que o Next recebe
    # tem de ser o mesmo que o visitante pediu, senão `/_next/...` não resolve.
    location / {
        proxy_pass http://landing:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
}
