# Proxy de DESENVOLVIMENTO — espelha o roteamento de produção.
#
# Sem ele, `/` vs `/app/` só existiria em produção: o roteamento seria testado
# direto lá, que é o pior lugar para descobrir uma barra final errada.
#
# A diferença para `deploy/nginx/app.conf` é só o alvo: aqui os dois front-ends
# são **dev servers** (Vite no painel, Next na landing), com HMR por WebSocket,
# em vez do build pronto. As regras de caminho são as mesmas, e é isso que se
# quer provar.
server {
    listen 80;
    server_name _;

    client_max_body_size 20m;

    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    location /fotos/ {
        proxy_pass http://minio:9000/;
        proxy_set_header Host $host;
    }

    # ---- Painel (Vite dev server) ------------------------------------------
    # A barra final remove o /app antes de repassar — exatamente como em
    # produção. O `base: '/app/'` do Vite faz o dev server servir os módulos sob
    # /app/, e o desprefixo aqui os devolve para a raiz que ele espera.
    #
    # `Upgrade`/`Connection` são o que mantém o HMR vivo: sem eles o WebSocket
    # do Vite cai e a página para de recarregar sozinha.
    location /app/ {
        proxy_pass http://web:5173/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location = /app   { return 301 /app/; }
    location = /login { return 301 /app/login; }
    location /cadastro/ { return 301 /app$request_uri; }

    # ---- Landing (Next dev server) -----------------------------------------
    # SEM barra final: o Next precisa receber o caminho como o visitante pediu,
    # senão `/_next/...` não resolve. `Upgrade` mantém o Fast Refresh vivo.
    location / {
        proxy_pass http://landing:5174;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
